environment:
  description: "You are a coordinator for a smart farm. Your goal is to manage a fleet of drones to protect the fields on the farm against birds. The overall goal is to minimize the damage to the fields."
  components:
    fields:
      type: Field
      description: "Fields on the farm with their location (rectangles) and bird-threat level (0 to 1)" # TODO: this contains additional attribute info (e.g., domain of threat level)
      id: id
      attributes:
#        location:
#          description: "location (rectangles)"  # TODO: can we generate the component description from this
        left:
          name: left
          attribute: left  # "component" is a placeholder for the component instance
          format: "{:d}"  # the format is optional
        top:
          name: top
          attribute: top
        right:
          name: right
          attribute: right
        bottom:
          name: bottom
          attribute: bottom
        threat_level:
          name: threat level
          format: "{:.2f}"
          attribute: threat_level
          description: "bird-threat level (0 to 1)"  # TODO: can we generate the component description from this
        protecting_drones:
          name: protecting
          format: "lambda value: f'{value:d} drone{\"s\" if value != 1 else \"\"}'"
          attribute: protecting_drones
          description: number of protecting drones
        necessary_drones_for_full_protection:
          name: "for full protection"
          format: "{:d} drones"
          attribute: necessary_drones_for_full_protection
assignments:
  assign_drones:
    components:
      type: Drone
      description: "Available drones"
      id: id
      attributes:
        state:
          name: state
          attribute: state
          # depends_on: ["target"]  # TODO
          # format: f"{value[0]}{' ({value[1].id})' if value[1] is not None else ''}"
        target:
          name: target field
          attribute: target
          description: None if drone is idle
          # TODO: either don't print separately and print as part of state, or print only if state == protecting (conditional attribute)
        location:
          name: location
          attribute: location
          description: has `x` and `y` coordinates
    ensembles:
      idle: "idle"
      protecting:
        for: Field  # component type
        name: f"protecting {component.id}"  # name generated from component
strategy: ""  # TODO: should it be per-assignment?
answer_format: "Drone_<N>: <group>"  # TODO
chain_of_thought: true
# Strategy interface - try two options:
#strategy_interface: The strategy must be written as a Python class that has an `adapt` method with parameters `simulation` and `step`.
strategy_interface: |
  The strategy must be written in Python and must be derived from this base class:
  ```
  class Adaptation(abc.ABC):
      @abc.abstractmethod
      def assign_drones(self, components, environment, step: int):
          pass
  ```
