name.append: _strategy
log_dir.append: _strategy
adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical
    strategy: "All Warriors should go to the Cave and attack the Dragon. They return to the Village only to eat and then go back to the Cave. Try to attack the Dragon early - at least once in the first 15 steps of the game. All Farmers should stay in Village and farm or spawn new villagers (both Farmers and Warriors are necessary so try to spawn at least two of each). Every villager must eat at least once in every 6 consecutive steps, so plan the meals accordingly so that no villager starves. Moving from the Cave to the Village takes one step, so a Warrior who has not eaten for 4 steps must leave the Cave to eat in time. Do not send a hungry Warrior to the Cave if they would have to return to eat before attacking the Dragon at least once - let them eat first. Plan the meals of the Warriors so that the Dragon is never left unattacked for more than 2 steps in a row (once there are at least two Warriors), because it regenerates."
