example: farm
steps: 300
adaptation_params:
  adapt_every: 10

drones: 8
birds: 80
charger: [22,21]
fields: [
  [3,4,18,19],
  [30,6,45,22],
  [32,35,48,43],
  [4,37,27,44],
]
mapWidth: 50
mapHeight: 50
patrolling: false

birdFieldProbabilities:
  0: [0.85, 0.05, 0.05, 0.05]
  100: [0.1, 0.7, 0.1, 0.1]
  200: [0, 0, 0.5, 0.5]
birdCohesion: 0.5  # 0 = birds use only birdFieldProbabilities, 1 = birds prefer fields with more birds

bird:
  IdleToAttackProb: 0.2
  AttackToAttackProb: 0.6  # keep eating in the same field
  MaxFleeInSameField: 3  # maximum number of scares in the same field, then fly randomly
  WaitBeforeEat: 5  # steps to wait before damage is dealt
  NearbyBirdsToEat: 2
  NearbyBirdsRadius: 6

log_dir: logs
