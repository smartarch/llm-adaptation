name: q_network_drone_reward_shaping
adaptation_name: adaptations.rl.q_network_adaptation_drone.QNetworkAdaptationDrone
adaptation_params:
  epsilon: 0.3
  epsilon_final: 0.01
  epsilon_final_steps: 30_000
  replay_buffer_size: 10_000
  layer_widths: [100, 100]
  batch_size: 64
  learning_rate: 0.001
  gamma: 0.99
  tau: 0.01
  train_every: 1
  target_update_every: 1
  save_path: rl_models/q_network_drone_reward_shaping
  reward_shaping:
    reward_state_consistence: 1
    reward_drone_charging: 2
    reward_drone_moving_to_charger: 0.4
    reward_drone_charging_battery: 0.25
    reward_drone_protecting: 1
    reward_drone_moving_to_field: 0.2
    reward_drone_protecting_battery: 0.5
  config: true
