adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical

    components:
      Field:
        id: id
        attributes:
          location:
            name: "top, bottom, left, right"
            description: "rectangle"
            if: "lambda component: False"  # hide among attributes, only use for description
            hide_in_generate: true  # hide in offline, only use in online prompt
          left:
            name: left
            format: "{:d}"  # the format is optional
          top:
            name: top
          right:
            name: right
          bottom:
            name: bottom
          threat_level:
            name: threat level
            format: "{:.2f}"
            description: "bird-threat level between 0 and 1"
          drones_for_full_protection:
            name: "for full protection"
            format: "{:d} drones"
          arriving_drones:
            name: flying to field
            format: "lambda value: f'{value:d} drone{\"s\" if value != 1 else \"\"}'"
            description: number of drones flying towards the field to protect it when they arrive
          protecting_drones:
            name: protecting
            format: "lambda value: f'{value:d} drone{\"s\" if value != 1 else \"\"}'"
            description: number of drones currently protecting the field
      Drone:
        id: id
        attributes:
          state:
            name: state
            format: "lambda value: value.value"
            description: '"idle", "moving_to_field", or "protecting"'
          target_id:
            name: target field
            description: name (str) of the target field, None if drone is idle
            if: "lambda component: component.state in [DroneState.MOVING_TO_FIELD, DroneState.PROTECTING]"
          location:
            name: location
            description: has `x` and `y` coordinates

    ensembles:
      Idle:
        name: "idle"
        description: "Idle drones don't protect any fields."
      Protecting:
        params:
          field: Field
        name: 'lambda field: f"protecting {field.id}"'  # name generated from params
        name_str: protecting {field.id}
        description: "Assigned drones fly to the field and protect it."

    domain_description: "You are a coordinator for a smart farm. Your goal is to manage a fleet of drones to protect the fields on the farm against birds. The overall goal is to minimize the damage to the fields."

    beyond_control_components:
      fields:
        type: Field
        description: Fields on the farm
        access: environment.fields  # how to access the list of components

    assignments:
      assign_drones:
        components:
          type: Drone
          description: "Drones"
        ensembles:
          - Idle
          - type: Protecting
            foreach: Field
            if: "lambda field: field.threat_level > 0"
            # string representation of "foreach" and "if"
            for_str: field
            in_str: environment.fields
            if_str: field.threat_level > 0
        constraints:
          no_overprotect:
            foreach: Protecting
            constraint: "lambda e: len(e) <= e.field.drones_for_full_protection"
            reason: "lambda e: f'Field {e.field.id} is overprotected ({e.field.drones_for_full_protection} drones for full protection, {len(e)} assigned), use the drones elsewhere.'"
#          fully_protect_most_threatened:  # formulated as a per-ensemble constraint
#            foreach: Protecting
#            if: "lambda e: e.field.threat_level == max([f.threat_level for f in environment.fields])"  # if two fields have the same threat level, both are selected
#            constraint: "lambda e: len(e) == e.field.drones_for_full_protection"
#            reason: "lambda e: f'The most threatened field should be fully protected ({e.field.id}, threat level {e.field.threat_level:.2f}, {e.field.drones_for_full_protection} drones for full protection, {len(e)} assigned).'"
          fully_protect_most_threatened_2:  # formulated as a global constraint
            constraint: "lambda: (
              protecting := [e for e in ensembles if e.type == 'Protecting'],
              most_threatened := max(protecting, key=lambda e: e.field.threat_level),
              len(most_threatened) == most_threatened.field.drones_for_full_protection
              )[-1]"  # to use assignments in lambda, we need to use a tuple with the ":=" operator and return only the last value
            reason: "lambda: (
              protecting := [e for e in ensembles if e.type == 'Protecting'],
              most_threatened := max(protecting, key=lambda e: e.field.threat_level),
              f'The most threatened field should be fully protected ({most_threatened.field.id}, threat level {most_threatened.field.threat_level:.2f}, {most_threatened.field.drones_for_full_protection} drones for full protection, {len(most_threatened)} assigned).'
              )[-1]"  # unfortunately, we need to repeat the same logic as we cannot access the intermediate variables

    strategy: ""  # optional
    strategy_interface:
      abstract_class: generated_adaptations.base_classes.farm.FarmAdaptation
      class: SmartFarmAdaptation

    chain_of_thought: true
    answer_format: component-first
    # answer_format: ensemble-first
