name.append: _strategy
log_dir.append: _strategy
adaptation_params:
  prompt_template_params:
    strategy: "Always fully protect the field with the highest threat level with the closest drones. Use as many drones as is required for full protection, but not more. If the field is already fully protected, keep the drones there to continue protection. Don't leave the remaining drones idle: send them to the next most threatened fields, fully protecting as many as possible. Avoid reassigning drones between fields unnecessarily, since a drone needs time to fly to a new field."