name: ppo_10steps
adaptation_name: adaptations.rl.ppo_adaptation.PPOAdaptation
adaptation_params:
  adapt_every: 10
  save_path: rl_models/ppo_10steps
  config: true

  batch_size: 64
  epochs: 5
  gamma: 0.97
  trace_lambda: 0.95

  common_layer_widths: [100]
  policy_layer_widths: [100]
  value_layer_widths: [100]
  learning_rate: 0.001
  entropy_regularization: 0.1
  clip_epsilon: 0.2
