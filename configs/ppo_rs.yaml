name: ppo_rs
adaptation_name: adaptations.rl.ppo_adaptation.PPOAdaptation
adaptation_params:
  adapt_every: 1
  save_path: rl_models/ppo_rs
  config: true

  batch_size: 64
  epochs: 5
  gamma: 0.97
  trace_lambda: 0.95
  drone_terminated_reward: -10

  common_layer_widths: [100]
  policy_layer_widths: [100]
  value_layer_widths: [100]
  learning_rate: 0.001
  entropy_regularization: 0.1
  clip_epsilon: 0.2

  reward_shaping:
    reward_state_consistence: 1
    reward_drone_charging: 2
    reward_drone_moving_to_charger: 0.4
    reward_drone_charging_battery: 0.25
    reward_drone_protecting: 1
    reward_drone_moving_to_field: 0.2
    reward_drone_protecting_battery: 0.5