name.append: _strategy
log_dir.append: _strategy
adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical
    strategy: "To win the game, the Dragon must be killed within 30 steps. All Warriors should go to the Cave and then attack the Dragon at least twice before they return to eat. All Farmers should stay in the Village. Every villager must eat at least once in every 6 consecutive steps. Plan the meals in advance so that no villager starves - Warriors need one step to get back to the Village and it might be necessary to keep wheat in reserve for future meals. If there is enough wheat to spawn a new villager and still keep a wheat reserve for meals in the next step, the Farmers in the Village should spawn a new villager (both Farmers and Warriors are necessary to win the game), otherwise, they should farm wheat. If no Warriors are alive, a new one should be spawned within 5 steps."
