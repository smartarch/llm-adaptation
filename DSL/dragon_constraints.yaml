adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical
    # All constraints are global, i.e., they see all the villagers and all the ensembles
    # (constraints defined per assignment would see only the villagers of that assignment).
    constraints:
      all_warriors_should_go_to_cave:
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
        constraint: "always(forall warrior in `Warriors`: `warrior.location == Map.VILLAGE and warrior not in GoToCaveEn and MAX > 0` implies within(1, MAX, `warrior in GoToCaveEn`))"
        reason: "Warrior {warrior} should go to the Cave to attack the Dragon."
      all_farmers_should_stay_in_village:
        variables:
          Farmers: "[v for v in VillagerComps if v.role == 'Farmer']"
        constraint: "always(forall farmer in `Farmers`: `farmer.location == Map.VILLAGE`)"
        reason: "Farmer {farmer} should stay in the Village."
      spawn_at_least_a_few_farmers:
        constraint: "within(2, MAX, `len(SpawnFarmerEn) >= 2`)"
        reason: "At least a few new farmers should be spawned to increase the chance of killing the Dragon."
      spawn_at_least_a_few_warriors:
        constraint: "within(2, MAX, `len(SpawnWarriorEn) >= 2`)"
        reason: "At least a few new warriors should be spawned to increase the chance of killing the Dragon."
      attack_at_least_once_during_first_half:
        constraint: "within(1, 15, `len(AttackEn) > 0`)"
        reason: "The Dragon should be attacked at least once in the first 15 steps of the game."
      attack_after_moving_to_cave:
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
        constraint: "always(forall warrior in `Warriors`: `warrior in GoToCaveEn and MAX > 0` implies within(1, MAX, `warrior in AttackEn`))"
        reason: "Warrior {warrior.name} should attack the Dragon after moving to the Cave."
      eat_regularly:
        constraint: "always(forall villager in `VillagerComps`: `villager.steps_since_meal >= MEAL_INTERVAL - 1` implies `villager in EatEn`)"
        reason: "Villager {villager} has not eaten for {villager.steps_since_meal} steps and must eat now (step {step}), otherwise they starve."
      keep_attacking:
        variables:
          MAX_GAP: "2"  # the Dragon can be left without an attack for at most 2 consecutive steps
          gap: "len(AttackEn) == 0 and DragonComps[0].fight_started"
        constraint: "always(within(`MAX_GAP`, `-MAX_GAP`, `gap`) implies `not gap`)"
        reason: "The Dragon was not attacked for more than {MAX_GAP} steps in a row (step {step}), so it regenerates its health. Keep attacking it without longer breaks."
      game_is_won:
        constraint: "within(1, MAX, `DragonComps[0].hp <= 0`)"
        reason: "To win the game, the Dragon must be killed."
