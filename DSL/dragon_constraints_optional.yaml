adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical
    # Optional functional constraints: they only give additional feedback (the strategy for winning the game),
    # they do not determine whether the AM is valid. They are merged with the required ones in dragon_constraints.yaml.
    constraints:
      all_warriors_should_go_to_cave:
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
        constraint: "always(forall warrior in `Warriors`: `warrior.location == Map.VILLAGE and warrior not in GoToCaveEn and MAX > 0` implies within(1, MAX, `warrior in GoToCaveEn`))"
        reason: "Warrior {warrior} should go to the Cave to attack the Dragon."
      spawn_warrior_when_none_left:
        # replaces "spawn at least two warriors" (LLMs spawned exactly two and stopped spawning when they died)
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
          SPAWN_WITHIN: "5"
        constraint: "always(`len(Warriors) == 0 and len(SpawnWarriorEn) < 2 and MAX >= SPAWN_WITHIN` implies within(1, `SPAWN_WITHIN`, `len(SpawnWarriorEn) >= 2`))"
        reason: "There were no Warriors at step {trigger_step}, so nobody could attack the Dragon, but no new Warrior was spawned in the next {SPAWN_WITHIN} steps. When there are no Warriors, a new Warrior should be spawned soon."
      attack_after_moving_to_cave:
        # A warrior sent to the Cave right after eating can attack 3 times before they have to return to eat
        # (assumes a non-hungry warrior; other constraints make the warriors go to the Cave after eating).
        # Near the end of the game, the number of attacks is limited by the remaining steps.
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
          ATTACKS: "2"
          WINDOW: "4"
        constraint: "always(forall warrior in `Warriors`: `warrior in GoToCaveEn and MAX > 0` implies within(`min(ATTACKS, MAX)`, `WINDOW`, `warrior in AttackEn`))"
        reason: "Warrior {warrior} moved to the Cave at step {trigger_step}, but they did not attack the Dragon at least {ATTACKS} times in the next {WINDOW} steps. After moving to the Cave, a warrior should attack the Dragon at least {ATTACKS} times before returning to the Village."
      spawn_when_enough_wheat:
        # "Enough wheat" = the cost of a Warrior (the more expensive villager, so that the AM can save for a Warrior instead
        # of being forced to spawn a Farmer) + a reserve of one meal for every villager. It is more than keep_wheat_reserve
        # requires (meals due in the next step), so spawning any villager never violates keep_wheat_reserve.
        # Spawning is not required in the last LAST_STEPS steps (a new villager would not help any more).
        variables:
          WARRIOR_COST: "12"
          Wheat: "FarmComps[0].wheat"
          RESERVE: "len(VillagerComps) * environment.meal_cost"
          LAST_STEPS: "5"
          FreeFarmers: "[v for v in VillagerComps if v.role == 'Farmer' and v.location == Map.VILLAGE and v not in EatEn]"
        constraint: "always(`Wheat >= WARRIOR_COST + RESERVE and len(FreeFarmers) >= 2 and MAX >= LAST_STEPS` implies `len(SpawnFarmerEn) >= 2 or len(SpawnWarriorEn) >= 2`)"
        reason: "At step {step}, there were {Wheat} wheat, which is enough to spawn a new villager (even a Warrior) and still keep a reserve of one meal for every villager ({RESERVE} wheat), and {len(FreeFarmers)} Farmers were not eating, but no new villager was spawned. When there is enough wheat, two Farmers should spawn a new villager instead of farming."
      all_farmers_should_stay_in_village:
        variables:
          Farmers: "[v for v in VillagerComps if v.role == 'Farmer']"
        constraint: "always(forall farmer in `Farmers`: `farmer.location == Map.VILLAGE`)"
        reason: "Farmer {farmer} should stay in the Village."
      spawn_at_least_a_few_farmers:
        constraint: "within(1, MAX, `len(SpawnFarmerEn) >= 2`)"
        reason: "At least one new farmer should be spawned to increase the chance of killing the Dragon."
