example: dragon
steps: 30

log_dir: logs/dragon

wheat: 10

farmers: 2
warriors: 1

farmer:
  HP: 4
  Attack: 1
  Farming: 5
  SpawnCost: 10

warrior:
  HP: 6
  Attack: 3
  Farming: 2
  SpawnCost: 12

# the parameters were tuned with dragon/tuning.py (see dragon/README.md)
dragon:
  HP: 100
  FireAttackProb: 0.4
  EatAttackProb: 0.2
  Regeneration: 5  # HP regained in each step without an attack (after the first attack), 0 = no regeneration

meals:
  interval: 6  # a villager must eat at least once in every 6 consecutive steps, otherwise they starve (null = no meals needed)
  cost: 1  # wheat consumed by one meal
  starvation_damage: 1  # HP lost in each step without a meal once the interval is exceeded
  hungry_cannot_attack: true  # starving villagers (interval exceeded) deal no damage to the Dragon
