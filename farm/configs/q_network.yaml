name: q_network
log_dir.append: /q_network
adaptation_name: adaptations.rl.q_network_adaptation_drone.QNetworkAdaptationDrone
adaptation_params:
  epsilon: 0.3
  epsilon_final: 0.01
  epsilon_final_steps: 30_000
  replay_buffer_size: 10_000
  layer_widths: [100, 100]
  batch_size: 64
  learning_rate: 0.001
  gamma: 0.99
  tau: 0.01
  train_every: 1
  target_update_every: 1
  save_path.append: /q_network
  config: true
