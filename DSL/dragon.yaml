adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical

    components:
      Dragon:
        attributes:
          hp:
            name: "Health"
      Farm:
        attributes:
          wheat:
            name: "Current wheat amount"
      Villager:
        id: name
        attributes:
          role:
            name: "Role"
            description: "\"Farmer\" or \"Warrior\""
          hp:
            name: "Health"
          state:
            name: "State"
            format: "lambda value: value.value"
            description: '"idle", "farming", "moving_to_village", "moving_to_cave", "attacking", or "spawning_new_villager"'

    ensembles:
      Farm:
        name: "farm"
        description: Stay in the Village and work on the farm
      GoToCave:
        name: "cave"
        description: Go to the Cave
      SpawnFarmer:
        name: "spawn farmer"
        description: For every two villagers assigned to this group and 10 wheat, a new Farmer is spawned.
      SpawnWarrior:
        name: "spawn warrior"
        description: For every two villagers assigned to this group and 12 wheat, a new Warrior is spawned.
      Attack:
        name: "attack"
        description: "Attack the Dragon"
      StayInCave:
        name: "cave"
        description: "Stay in the Cave"
      GoToVillage:
        name: "village"
        description: "Go to the Village"

    domain_description: |
      You play a computer game. The goal is to kill a Dragon as fast as possible.
      The Dragon lives in a Cave near a Village. The player controls villagers. The villagers can either be in the Village and work on a farm (and produce wheat) or they can go to the Cave, where they can attack the Dragon.
      There are two types of villagers - farmers and warriors. Farmers produce more wheat when they work on a farm, and warriors deal more damage to the Dragon.

    beyond_control_components:
      dragon:
        type: Dragon
        singleton: true
        description: "The Dragon"
        access: environment.dragon
      farm:
        type: Farm
        singleton: true
        description: "The Farm"
        access: environment.farm

    assignments:
      assign_in_village:
        components:
          type: Villager
          if: "lambda component: component.location == Map.VILLAGE"
          description: "Villagers in the Village"
        ensembles: [Farm, GoToCave, SpawnFarmer, SpawnWarrior]
        constraints:
          go_to_cave_at_least_once:
            constraint: "once(`len(GoToCaveEn) > 0`)"
            reason: "lambda e: f'At least one villager should go to the Cave to attack the Dragon.'"
          spawn_at_least_a_few:
            constraint: "scattered(3, `len(SpawnFarmerEn) >= 2 or len(SpawnWarriorEn) >= 2`)"
            reason: "lambda: f'At least a few new villagers should be spawned to increase the chance of killing the dragon.'"
      assign_in_cave:
        components:
          type: Villager
          if: "lambda component: component.location == Map.CAVE"
          description: "Villagers in the Cave"
        ensembles: [Attack, StayInCave, GoToVillage]
        constraints:
          attack_at_least_once:
            constraint: "once(`len(AttackEn) > 0`)"
            reason: "lambda e: f'The dragon should be attacked.'"
    constraints:
      attack_after_moving_to_cave:
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
        constraint: "forall warrior in `Warriors`: consequent(1, `warrior in GoToCaveEn`) implies once(`warrior in AttackEn`)"
        reason: "lambda warrior: f'Warrior {warrior.id} should attack the Dragon after moving to the Cave.'"
      warriors_should_be_in_cave:
        variables:
          Warriors: "[v for v in VillagerComps if v.role == 'Warrior']"
        constraint: "scattered(`0.8 * MAX`, `len([v for v in Warriors if v.location == Map.CAVE]) >= 0.5 * len(Warriors)`)"
        reason: "lambda: f'At least half of the warriors should be in the Cave so they can attack the Dragon.'"

    strategy: ""  # optional
    strategy_interface:
      abstract_class: generated_adaptations.base_classes.dragon.DragonHuntAdaptation
      class: SmartAdaptation

    chain_of_thought: true
    answer_format: component-first
