adaptation_params:  # this is purely technical
  prompt_template_params:  # this is purely technical
    strategy: "To win the game, the Dragon must be killed within 30 steps. All Warriors should go to the Cave and then attack the Dragon. All Farmers should stay in Village and farm wheat or spawn new villagers. Spawn enough new villagers (both Farmers and Warriors) to increase the chance of killing the Dragon. Every villager must eat at least once in every 6 consecutive steps. Plan the meals in advance so that no villager starves - Warriors need one step to get back to the Village and it might be necessary to keep wheat in reserve for future meals."
